version: 2
updates:
  # 1. Checks your PHP/Laravel packages weekly
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    # Groups all Laravel core updates into a single PR (prevents spam)
    groups:
      laravel-updates:
        patterns:
          - "laravel/*"
          - "illuminate/*"

  # 2. Checks your GitHub Actions weekly (e.g., checkout@v4, setup-php@v2)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"